# ============================================================
#  TouristService - Application Properties
#  SOA Lab: Tourist Records API with Token Validation
# ============================================================

# ----- Server -----
server.port=8080
 2
# ----- PostgreSQL DataSource -----
spring.datasource.url=jdbc:postgresql://localhost:5432/tourism
spring.datasource.username=postgres
spring.datasource.password=KPujith@2706
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA / Hibernate -----
# 'update' creates the table on first run and updates schema on changes.
# Change to 'create-drop' to drop & recreate table every restart (loses data).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ----- Springdoc / Swagger -----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method

# ----- Custom Token -----
# This is the pre-generated valid token used for all API authentication.
app.valid.token=MY_VALID_TOKEN
